name: Diagnose (tijdelijk)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/diagnose.py"
      - ".github/workflows/diagnose.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python scripts/diagnose.py https://www.bevegan.be/ https://www.bevegan.be/nl/
