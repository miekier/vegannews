name: Tijdelijk - standhouders zoeken

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zoek:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Zoeken
        run: |
          mkdir -p uit
          python - <<'EOF'
          import os, re, html, json, requests
          from urllib.parse import urljoin, urlparse
          from vegannieuws.config import Instellingen
          from vegannieuws.ophalen import OphaalFout, Ophaler
          from vegannieuws.staat import Staat
          s = requests.Session(); s.headers["User-Agent"] = "Mozilla/5.0 (vegannieuws bronnenonderzoek)"
          uit = open("uit/resultaten.txt", "w", encoding="utf-8")
          def schrijf(*x): print(*x, file=uit, flush=True)
          def tekst(x): return " ".join(html.unescape(re.sub(r"<[^>]+>", " ", x)).split())
          token = os.environ["INSTAGRAM_TOKEN"]
          o = Ophaler(Staat(), Instellingen()); ig = o._instagram_gebruikers_id(token)
          import time
          for h in ['smoothcreamery', 'lespiments_com', 'irminhildis.komboecha', 'brighteyesvzw', 'gaiabelgium', 'thedunes.skincare', 'coffee_bar_on_wheels', 'collectiefuitgezonderd', 'dieranimal', 'boshi_juices', 'hotdogsnotrealdogs', 'wearthetruthshop', 'junglicious_', 'thegreentablefood', 'sweetyveganforall', 'quechew', 'velife.style', 'magpies.taart', 'my_pureliving', 'nutsaboutnammm', 'artamandua_dierzame_shirts', 'garlicngreens', 'celosia.sanctuary', 'y.bae_you.before.anything.else', 'oseap_co', 'figlina', 'leafskincare.be', 'canela.brugge', 'karmamarkt', 'lunacreations.gent', 'meltzantwerp', 'tak_aplantbasedlifestyle', 'gewoon.anders', 'lacuisinedegeorgette_huy', 'luvveggie', 'plant.a.pizza', 'cosy_green', 'zondereibakkerij', 'zonder.ei.bakkerij', 'angelinascatering', 'angelinas_catering', 'hoisfarm', 'hois_farm', 'ratopia_vzw', 'rattenopvangratopia', 'meiskitchen.be', 'meis.kitchen', 'ohoats.be', 'oh.oats', 'cometevege', 'muppetmeals', 'mycakes.be', 'wiesengust', 'wies.en.gust', 'ahimsapottery', 'ahimsa.pottery', 'olefacio', 'biotop.be', 'biotopbelgium', 'hopeandhayvzw', 'hope.and.hay', 'depret.zedelgem', 'loszieto', 'doghappinessvzw', 'dog.happiness.vzw', 'newethicsvzw', 'itsjolene.be', 'antoinette.antwerpen', 'bakkerijfrimout', 'wafflesveg', 'honkies.be', 'minestrone.be', 'dar.line.chocolatier', 'ohma.gent', 'seashepherdbelgium', 'plentyfoodbelgium', 'plantapizza', 'leafcosmetics', 'zomerziel', 'hopeandhay', 'champion.aperitief']:
              velden = f"business_discovery.username({h}){{username,name,biography,followers_count,media.limit(1){{timestamp}}}}"
              try:
                  a = o._graph(ig, {"fields": velden}, token).get("business_discovery") or {}
                  schrijf(json.dumps({"u": h, "naam": a.get("name"), "volgers": a.get("followers_count"),
                      "laatste": ((((a.get("media") or {}).get("data") or [{}])[0]).get("timestamp", "") or "")[:10],
                      "bio": " ".join((a.get("biography") or "").split())[:120]}, ensure_ascii=False))
              except OphaalFout as fout:
                  schrijf(json.dumps({"u": h, "fout": str(fout)[:50]}, ensure_ascii=False))
                  if "limiet" in str(fout).lower(): break
              time.sleep(1)
          EOF
          wc -l uit/resultaten.txt
      - name: Bewaren in tijdelijke branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan tijdelijk-standhouders
          git rm -rq --cached .
          git add -f uit/resultaten.txt
          git commit -qm "Resultaten standhouders"
          git push -qf origin HEAD:tijdelijk-standhouders
