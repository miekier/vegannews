name: Tijdelijk - standhouders zoeken

on:
  push:
    branches: [main]
    paths: [".github/workflows/standhouders.yml"]

permissions:
  contents: write

jobs:
  zoek:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Zoeken
        run: |
          mkdir -p uit
          python - <<'EOF'
          import os, re, html, json, requests
          from urllib.parse import urljoin, urlparse
          from vegannieuws.config import Instellingen
          from vegannieuws.ophalen import OphaalFout, Ophaler
          from vegannieuws.staat import Staat
          s = requests.Session(); s.headers["User-Agent"] = "Mozilla/5.0 (vegannieuws bronnenonderzoek)"
          uit = open("uit/resultaten.txt", "w", encoding="utf-8")
          def schrijf(*x): print(*x, file=uit, flush=True)
          def tekst(x): return " ".join(html.unescape(re.sub(r"<[^>]+>", " ", x)).split())
          token = os.environ["INSTAGRAM_TOKEN"]
          o = Ophaler(Staat(), Instellingen()); ig = o._instagram_gebruikers_id(token)
          # 4. Bijschriften van Vegan A'fairs (seizoen 2025 en 2026): standhouders worden er bij naam voorgesteld
          na = ""
          for _ in range(10):
              extra = f".after({na})" if na else ""
              m = (o._graph(ig, {"fields": f"business_discovery.username(vegan.afairs){{media.limit(50){extra}{{caption,timestamp}}}}"}, token)
                   .get("business_discovery") or {}).get("media") or {}
              for post in m.get("data", []):
                  if post.get("timestamp", "") >= "2025-08-01":
                      schrijf("VA", post["timestamp"][:10], " ".join((post.get("caption") or "").split()))
              nieuw = ((m.get("paging") or {}).get("cursors") or {}).get("after", "")
              if not m.get("data") or not nieuw or nieuw == na: break
              if m["data"][-1].get("timestamp", "") < "2025-08-01": break
              na = nieuw
          EOF
          wc -l uit/resultaten.txt
      - name: Bewaren in tijdelijke branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan tijdelijk-standhouders
          git rm -rq --cached .
          git add -f uit/resultaten.txt
          git commit -qm "Resultaten standhouders"
          git push -qf origin HEAD:tijdelijk-standhouders
