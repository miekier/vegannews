name: Nieuws verzamelen

on:
  schedule:
    # Eén verzamelrun per dag: 04:23 UTC = 05:23 Belgische wintertijd (zomertijd: 06:23).
    # GitHub start geplande runs soms te laat of niet. Daarom twee reservetijden (07:53 en 10:23
    # Belgische wintertijd): een reserverun stopt meteen als de run van vandaag al gebeurd is (job planning).
    - cron: "23 4 * * *"
    - cron: "53 6 * * *"
    - cron: "23 9 * * *"
  workflow_dispatch:
    inputs:
      terugvullen:
        description: "Ook ouder nieuws opzoeken via Google Nieuws: aantal dagen terug (0 = niet)"
        required: false
        default: "0"
      herindelen:
        description: "Onderwerpen van bestaande berichten opnieuw bepalen (na een wijziging van categorieen.yml)"
        type: boolean
        default: false
      controleren:
        description: "Enkel alle bronnen testen en het resultaat tonen (wijzigt niets)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "bronnen.yml"
      - "zoekopdrachten.yml"
      - "categorieen.yml"
      - "instellingen.yml"
      - "src/**"
      - "site/*.html"
      - "site/*.js"
      - "site/*.css"
      - ".github/workflows/verzamel.yml"

permissions:
  contents: write
  models: read

concurrency:
  group: verzamelen
  cancel-in-progress: false

jobs:
  planning:
    # Enkel bij geplande runs: is er vandaag (na 04:00 UTC) al verzameld, dan verzamelt deze run niet.
    runs-on: ubuntu-latest
    outputs:
      doorgaan: ${{ steps.controle.outputs.doorgaan }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          sparse-checkout: site/data/index.json
          sparse-checkout-cone-mode: false
      - id: controle
        run: |
          doorgaan=true
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f site/data/index.json ]; then
            laatst=$(python3 -c "import json; print(json.load(open('site/data/index.json')).get('bijgewerkt', ''))")
            grens="$(date -u +%Y-%m-%d)T04:00:00Z"
            if [[ "$laatst" > "$grens" ]]; then
              doorgaan=false
              echo "Vandaag al verzameld (laatste run gestart om $laatst): deze reserverun stopt." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "doorgaan=$doorgaan" >> "$GITHUB_OUTPUT"

  verzamel:
    needs: planning
    if: ${{ needs.planning.outputs.doorgaan == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: src
      PYTHONUNBUFFERED: "1"
    steps:
      # Altijd de laatste stand van main: een run die in de wachtrij stond, start zo vanaf de
      # gegevens van de vorige run en niet vanaf de stand op het moment dat hij werd gestart.
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Benodigdheden installeren
        run: pip install -r requirements.txt

      - name: Bronnen controleren
        if: ${{ inputs.controleren }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python -m vegannieuws controleer

      - name: Onderwerpen opnieuw bepalen
        if: ${{ inputs.herindelen && !inputs.controleren }}
        run: python -m vegannieuws herindeel

      - name: Nieuws verzamelen
        if: ${{ !inputs.controleren }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TERUGVULLEN: ${{ inputs.terugvullen || '0' }}
        run: python -m vegannieuws verzamel --terugvullen "$TERUGVULLEN"

      - name: Resultaten bewaren
        if: ${{ !inputs.controleren }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data staat
          if git diff --cached --quiet; then
            echo "Geen wijzigingen"
            exit 0
          fi
          git commit -q -m "Nieuws bijgewerkt $(date -u +'%Y-%m-%d %H:%M') UTC"
          for poging in 1 2 3 4; do
            if git pull --rebase -q origin main; then
              if git push -q origin HEAD:main; then exit 0; fi
            else
              git rebase --abort || true
              git reset -q --hard origin/main
              echo "::warning::De gegevens werden intussen door een andere run gewijzigd. De resultaten van deze run worden niet bewaard; de volgende run haalt hetzelfde nieuws opnieuw op."
              exit 0
            fi
            sleep $((poging * 5))
          done
          exit 1

      - name: Website klaarzetten
        if: ${{ !inputs.controleren }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  publiceer:
    needs: verzamel
    if: ${{ needs.verzamel.result == 'success' && !inputs.controleren }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicatie.outputs.page_url }}
    steps:
      - name: Website publiceren
        id: publicatie
        uses: actions/deploy-pages@v4
