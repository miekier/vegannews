name: Taalmodellen vergelijken

# Blinde vergelijking: Claude en Gemini verwerken dezelfde recente berichten.
# Het resultaat (vergelijking/vergelijking.json) dient voor een beoordelingspagina.
on:
  workflow_dispatch:
    inputs:
      aantal:
        description: "Aantal berichten (gelijk verdeeld over andere talen, Nederlands en Engels)"
        default: "36"

permissions:
  contents: write

concurrency:
  group: verzamelen
  cancel-in-progress: false

jobs:
  vergelijk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Benodigdheden installeren
        run: pip install -r requirements.txt

      - name: Vergelijken
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AANTAL: ${{ inputs.aantal || '36' }}
        run: python -m vegannieuws vergelijk --aantal "$AANTAL"

      - name: Resultaat bewaren
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vergelijking
          git diff --cached --quiet && exit 0
          git commit -q -m "Vergelijking van taalmodellen $(date -u +'%Y-%m-%d %H:%M') UTC"
          for poging in 1 2 3 4; do
            if git pull --rebase -q origin main && git push -q origin HEAD:main; then exit 0; fi
            sleep $((poging * 5))
          done
          exit 1
