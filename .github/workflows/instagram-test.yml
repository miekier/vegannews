name: Instagram testen (tijdelijk)

on:
  push:
    branches: [main]
    paths: [".github/workflows/instagram-test.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Kandidaat-accounts testen
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
        run: |
          python - <<'EOF'
          import os
          from vegannieuws.config import Instellingen
          from vegannieuws.ophalen import OphaalFout, Ophaler
          from vegannieuws.staat import Staat
          token = os.environ["INSTAGRAM_TOKEN"]
          ophaler = Ophaler(Staat(), Instellingen())
          ig = ophaler._instagram_gebruikers_id(token)
          print("waarschuwingen:", ophaler.waarschuwingen)
          for naam in ['gaia.be', 'oyohealthy', 'knolkool.gent', 'komkommertijd', 'humusxhortense', 'humus.hortense', 'lazlo.brussels', 'noje.brussels', 'liulin.be', 'amaranth.restaurant', 'restaurantamaranth', 'noordoever.leuven', 'epiphanyskitchen', 'provegbelgium', 'proveg.belgie', 'dagenzondervlees', 'bitebackbe', 'biteback.be', 'animalrights.be', 'animalrightsbelgium', 'veggiechallenge', 'vegan.afairs', 'brugesvegan', 'vegansummerfest', 'eva.kempen', 'vrijmoed', 'bodhi.leuven', 'stillwaters.gent', 'lekkergec', 'plantbaseduniversities.be']:
              velden = f"business_discovery.username({naam}){{username,name,biography,followers_count,media_count,media.limit(1){{caption,timestamp}}}}"
              try:
                  a = ophaler._graph(ig, {"fields": velden}, token).get("business_discovery") or {}
              except OphaalFout as fout:
                  print(f"- {naam}: FOUT {fout}")
                  continue
              post = ((a.get("media") or {}).get("data") or [{}])[0]
              bio = " ".join((a.get("biography") or "").split())[:110]
              print(f"- {naam}: OK | {a.get('name')} | volgers {a.get('followers_count')} | posts {a.get('media_count')} | laatste {post.get('timestamp','-')[:10]}")
              print(f"      bio: {bio}")
              print(f"      post: {' '.join((post.get('caption') or '').split())[:100]}")
          EOF
