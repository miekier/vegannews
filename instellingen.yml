# Instellingen van Vegannieuws. Alle waarden zijn optioneel; dit zijn de standaardwaarden.

# Taal van het overzicht: nl (Nederlands) of en (Engels).
doeltaal: nl
# Berichten in deze talen worden niet vertaald (de kernzin komt wel in de doeltaal).
talen_zonder_vertaling: [nl, en]
tijdzone: Europe/Brussels

# Berichten ouder dan dit aantal dagen worden bij het ophalen genegeerd.
max_leeftijd_dagen: 60
# Beperking bij zoekopdrachten in Google Nieuws (when:7d = afgelopen 7 dagen).
google_recentheid: "when:7d"
# Wachttijd tussen twee verzoeken aan Google Nieuws, in seconden.
google_pauze_s: 1.5
# Aantal bronnen dat tegelijk wordt opgehaald.
gelijktijdig: 12

# Taalmodel voor vertaling, kernzin, onderwerp, land en plaats.
# Het programma gebruikt de eerste aanbieder in llm_aanbieders waarvoor een sleutel is ingesteld;
# lukt het daar niet (bv. tegoed op of daglimiet), dan neemt de volgende het over
# (GitHub: Settings -> Secrets and variables -> Actions -> New repository secret):
#   anthropic : secret ANTHROPIC_API_KEY, Claude (betalend, vooraf gekocht tegoed via https://platform.claude.com)
#   gemini    : secret GEMINI_API_KEY, gratis sleutel via https://aistudio.google.com/apikey
#   groq      : secret GROQ_API_KEY, gratis sleutel via https://console.groq.com/keys
#   github    : GitHub Models via het ingebouwde GITHUB_TOKEN (sinds oktober 2026 niet meer beschikbaar)
# Zonder sleutel gebeurt de indeling met trefwoorden.
llm_aan: ja
llm_aanbieders: [anthropic, gemini, groq]
llm_modellen_anthropic: [claude-haiku-5-5]
# Modellen per aanbieder, in volgorde van voorkeur; het volgende wordt gebruikt als een model niet bestaat.
llm_modellen_gemini: [gemini-flash-lite-latest, gemini-2.5-flash-lite, gemini-flash-latest, gemini-2.5-flash]
llm_modellen_groq: [llama-3.3-70b-versatile, openai/gpt-oss-120b, llama-3.1-8b-instant]
llm_modellen: [openai/gpt-4.1-mini, openai/gpt-4o-mini]
# Eén verzoek verwerkt llm_batch berichten. Gratis limiet van Gemini Flash-Lite (2025): ca. 1 000
# verzoeken per dag en 15 per minuut; bij HTTP 429 stopt de run en gaat de volgende verder.
llm_max_verzoeken_per_run: 120
llm_max_verzoeken_per_dag: 240
llm_batch: 12
llm_pauze_s: 4.5
llm_max_pogingen: 3
# Enkel berichten van de afgelopen ... dagen gaan nog naar het taalmodel (zelfde termijn als max_leeftijd_dagen,
# zodat ook oudere artikels van nieuwe bronnen vertaald en ingedeeld worden). Nieuwste berichten gaan voor;
# llm_max_verzoeken_per_dag begrenst de kosten.
llm_max_leeftijd_dagen: 60

# Posts op Instagram en Facebook (via Google Nieuws) blijven enkel als ze volgens het taalmodel
# over dit land gaan. Leeg ("") = posts over alle landen behouden. Geldt niet voor zelf gevolgde accounts.
sociaal_enkel_land: BE

# Instagram-accounts volgen via de officiële API (secret INSTAGRAM_TOKEN; zie README).
instagram_api_versie: v26.0
# Aantal recente posts dat per account en per run wordt opgehaald.
instagram_posts_per_account: 12

# Verhalen: berichten van verschillende bronnen over hetzelfde nieuws worden gebundeld onder één
# Nederlandse kop. Berichten met gelijkaardige woorden in kernzin en titel vormen kandidaatgroepen;
# het taalmodel beslist welke samenhoren en schrijft de kop. Telt mee voor het dagbudget hierboven.
verhalen_aan: ja
# Berichten van de afgelopen ... dagen worden met elkaar vergeleken.
verhalen_venster_dagen: 4
verhalen_max_verzoeken_per_run: 6
# De koppen van verhalen schrijft een sterker gratis model (enkele verzoeken per dag). Bereikt dat
# zijn daglimiet, dan neemt het model van de berichten (llm_modellen_gemini) het over.
verhalen_modellen_gemini: [gemini-flash-latest, gemini-2.5-flash]

# Reservevertaling van titels via MyMemory (gratis, ca. 5 000 tekens per dag)
# voor berichten die het taalmodel (nog) niet verwerkte.
reserve_vertaling: ja
reserve_max_tekens_per_dag: 4500
# Optioneel: met een e-mailadres stijgt de MyMemory-limiet naar 50 000 tekens per dag.
mymemory_email: ""
