  # --- Wetenschap: nieuwe artikels in PubMed (afgelopen 7 dagen) ----------------------------
  - zoekterm: 'vegan*[tiab] OR "plant-based diet*"[tiab] OR vegetarian*[tiab] OR "cultivated meat"[tiab] OR "cultured meat"[tiab] OR "meat substitute*"[tiab] OR "meat alternative*"[tiab]'
    naam: PubMed – nieuwe studies
    dienst: pubmed
    land: INT
    taal: en
    alleen_vegan: nee

