# Zoekopdrachten in nieuwsaggregators. Hiermee worden ook kleine en regionale nieuwssites
# gevonden die zelf geen bruikbare feed hebben (Google Nieuws indexeert duizenden media).
#
# Velden:
#   zoekterm:  wat gezocht wordt. "aanhalingstekens" = exacte woordgroep, OR = of (in hoofdletters)
#   dienst:    google (standaard) | bing | pubmed (wetenschappelijke artikels)
#   land:      BE = Belgische editie van Google Nieuws; NL, FR, DE, GB, US, ... ; INT
#   taal:      nl | fr | en | de | ...  (bepaalt samen met land de editie, bv. BE + fr = Belgisch-Frans)
#   naam:      optionele weergavenaam
#   editie:    optioneel: Google Nieuws-editie als land:taal (bv. GB:en, PT:pt-150); standaard volgt ze uit land en taal
#   recentheid: optioneel: zoekvenster, bv. "when:30d" voor landen met weinig nieuws (standaard "when:7d")
#   enkel_land: optioneel: enkel berichten over dit land behouden, bv. BE (het taalmodel bepaalt het land)
#   alleen_vegan: ja (standaard) = resultaten zonder vegan-gerelateerd woord worden weggelaten
#   actief:    nee = tijdelijk niet uitvoeren
#
# Toevoegen kan ook via de knop "Bron toevoegen" op de website (kies "Zoekopdracht").

zoekopdrachten:
  # --- België, Nederlandstalig ----------------------------------------------------------
  - zoekterm: vegan
    land: BE
    taal: nl
  - zoekterm: veganistisch
    land: BE
    taal: nl
  - zoekterm: plantaardig
    land: BE
    taal: nl
  - zoekterm: vegetarisch
    land: BE
    taal: nl
  - zoekterm: '"vegan restaurant" OR "veganistisch restaurant" OR "vegetarisch restaurant"'
    land: BE
    taal: nl
  - zoekterm: vegan opent
    land: BE
    taal: nl
  - zoekterm: dierenwelzijn
    land: BE
    taal: nl
  - zoekterm: dierenrechten OR GAIA
    land: BE
    taal: nl
  - zoekterm: kweekvlees OR precisiefermentatie OR vleesvervangers
    land: BE
    taal: nl
  - zoekterm: '"minder vlees" OR eiwittransitie OR "Dagen Zonder Vlees"'
    land: BE
    taal: nl

  # --- België, Franstalig ------------------------------------------------------------------
  - zoekterm: vegan
    land: BE
    taal: fr
  - zoekterm: végane OR végétalien
    land: BE
    taal: fr
  - zoekterm: végétarien
    land: BE
    taal: fr
  - zoekterm: '"restaurant vegan" OR "restaurant végétal" OR "restaurant végétarien"'
    land: BE
    taal: fr
  - zoekterm: '"bien-être animal"'
    land: BE
    taal: fr
  - zoekterm: '"alternatives végétales" OR "viande végétale"'
    land: BE
    taal: fr

  # --- België: posts op Instagram en Facebook ---------------------------------------------
  # Google Nieuws vindt ook openbare posts van zaken en organisaties. De link loopt via
  # news.google.com en stuurt door naar de post. Elke post gaat langs het taalmodel: enkel posts
  # met nieuws (opening, sluiting, nieuw product, evenement, actie ...) over België blijven.
  # Een zaak of organisatie volgen: voeg een zoekopdracht toe zoals
  #   - zoekterm: site:instagram.com "naam van de zaak"
  - zoekterm: site:instagram.com vegan
    naam: "Instagram via Google Nieuws: vegan"
    land: BE
    taal: nl
    recentheid: "when:2d"
    enkel_land: BE
  - zoekterm: site:instagram.com veganistisch OR plantaardig OR veggie
    naam: "Instagram via Google Nieuws: veganistisch, plantaardig, veggie"
    land: BE
    taal: nl
    recentheid: "when:3d"
    enkel_land: BE
  - zoekterm: site:instagram.com vegan Gent OR Antwerpen OR Brussel OR Leuven OR Brugge OR Mechelen OR Hasselt OR Kortrijk
    naam: "Instagram via Google Nieuws: vegan in Vlaamse steden en Brussel"
    land: BE
    taal: nl
    enkel_land: BE
  - zoekterm: site:instagram.com vegan OR végane OR végétal
    naam: "Instagram via Google Nieuws: vegan (Franstalig)"
    land: BE
    taal: fr
    recentheid: "when:2d"
    enkel_land: BE
  - zoekterm: site:instagram.com vegan Bruxelles OR Liège OR Namur OR Charleroi OR Mons OR Louvain-la-Neuve
    naam: "Instagram via Google Nieuws: vegan in Wallonië en Brussel"
    land: BE
    taal: fr
    enkel_land: BE
  - zoekterm: site:facebook.com vegan OR veganistisch OR plantaardig
    naam: "Facebook via Google Nieuws: vegan"
    land: BE
    taal: nl
    recentheid: "when:3d"
    enkel_land: BE
  - zoekterm: site:facebook.com vegan OR végane OR végétal
    naam: "Facebook via Google Nieuws: vegan (Franstalig)"
    land: BE
    taal: fr
    recentheid: "when:3d"
    enkel_land: BE

