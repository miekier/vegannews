# Soort gebeurtenis, getoond als label bij restaurants, winkels, bedrijven en producten.
gebeurtenissen:
  opening:
    naam: Opening
    geldt_voor: [horeca, retail, bedrijven]
    trefwoorden: [opent, opende, openen, geopend, heropent, heropend, nieuwe vestiging*, nieuwe zaak, nieuw restaurant, nieuwe winkel, opent de deuren, ouvre, ouvert, ouverture, ouvrira, inaugure*, inauguration, nouveau restaurant, nouvelle adresse, opens, opened, grand opening, now open, eroffnet, eroffnung, neueroffnung, eroeffnet, eroeffnung]
  sluiting:
    naam: Sluiting
    geldt_voor: [horeca, retail, bedrijven]
    trefwoorden: [sluit, sluiten, gesloten, sluiting, definitief dicht, deuren dicht, stopt ermee, failliet, faillissement, ferme ses portes, ferme definitivement, fermeture, faillite, closes, closed, closing, shuts, shut down, shutters, bankrupt*, bankruptcy, insolvency, schliesst, schliessung, geschlossen, insolvenz, pleite]
  lancering:
    naam: Nieuw product
    geldt_voor: [producten, bedrijven, innovatie, retail]
    trefwoorden: [lanceert, gelanceerd, lancering, introduceert, nieuw product, nieuwe producten, nieuw in het assortiment, brengt op de markt, lance, lancement, nouveau produit, nouvelle gamme, launches, launched, launch, unveils, unveiled, rolls out, new product, new range, markteinfuhrung, bringt auf den markt, neu im sortiment, neues produkt]
