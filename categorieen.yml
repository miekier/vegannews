# Onderwerpen (categorieën) en trefwoorden
#
# Elk bericht krijgt 1 tot 3 onderwerpen. Als het gratis taalmodel beschikbaar is,
# kiest dat model de onderwerpen op basis van de naam en omschrijving hieronder.
# Anders telt het programma de trefwoorden: een treffer in de titel telt dubbel.
#
# Schrijfwijze van trefwoorden:
#   - Hoofdletters en accenten maken niet uit ("végétal" = "vegetal").
#   - Een koppelteken telt als spatie ("plant-based" = "plant based").
#   - woord      : enkel het volledige woord
#   - woord*     : alles wat met "woord" begint (restaurant* -> restaurants, restauranthouder)
#   - *woord*    : "woord" overal in een woord (*restaurant* -> veganrestaurant)
#   - Meerdere woorden ("foie gras") moeten in die volgorde voorkomen.
#
# Na een wijziging kun je oudere berichten opnieuw laten indelen:
# Actions -> "Nieuws verzamelen" -> Run workflow -> "Opnieuw indelen" aanvinken.

