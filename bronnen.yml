# Bronnenregister: websites, feeds en sociale-media-accounts die gevolgd worden.
#
# Toevoegen of uitschakelen kan op twee manieren:
#   1. Via de knop "Bron toevoegen" op de website (een formulier op GitHub; werkt ook op je gsm).
#      De bron wordt eerst getest en daarna automatisch in deze lijst gezet.
#   2. Door dit bestand rechtstreeks op GitHub te bewerken (potloodicoon).
#
# Velden per bron:
#   naam:         weergavenaam (verplicht)
#   url:          adres van de website, RSS-feed, Bluesky-, Mastodon- of YouTube-account (verplicht)
#                 - website: de feed wordt automatisch gezocht
#                 - Bluesky: https://bsky.app/profile/naam.bsky.social
#                 - Mastodon: https://mastodon.social/@naam
#                 - YouTube: https://www.youtube.com/@kanaalnaam
#                 - Instagram: https://www.instagram.com/gebruikersnaam/ (officiële API; enkel
#                   zakelijke of creator-accounts; vraagt de secret INSTAGRAM_TOKEN, zie README)
#   type:         organisatie | horeca | bedrijf | persoon | medium | overheid | wetenschap
#                 (organisatie, horeca, bedrijf, persoon, overheid en wetenschap = primaire bron)
#   land:         BE voor Belgische bronnen, anders de landcode (NL, FR, DE, GB, US, ...) of INT
#   taal:         nl | fr | en | de | ...
#   alleen_vegan: ja = enkel berichten over veganisme/dierenrechten bewaren (algemene bronnen)
#                 nee = alle berichten van deze bron bewaren (bron gaat volledig over het thema)
#   actief:       nee = tijdelijk niet ophalen (standaard: ja)
#   notitie:      vrije tekst
#
# Instagram-accounts van zaken en organisaties volg je met hun adres (zie hierboven). Elke post gaat
# langs het taalmodel; enkel posts met nieuws verschijnen. Daarnaast vinden zoekopdrachten in Google
# Nieuws openbare Instagram- en Facebookposts (site:instagram.com ..., zie zoekopdrachten.yml).

